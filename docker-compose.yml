name: ev-station-frontend
services:
  web:
    build:
      context: .
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_GOOGLE_MAPS_BROWSER_API_KEY: ${VITE_GOOGLE_MAPS_BROWSER_API_KEY:-}
    environment:
      API_UPSTREAM: ${API_UPSTREAM:-http://host.docker.internal:8080}
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "${WEB_PORT:-8081}:80"
    restart: unless-stopped
